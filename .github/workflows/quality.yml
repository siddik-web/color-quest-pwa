name: Quality checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    name: Web assets, smoke tests and browser gameplay
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm test
      - name: Run browser gameplay tests
        run: npm run test:e2e
      - name: Build Capacitor web bundle
        run: npm run web
      - name: Verify bundled artwork
        run: test -d www/assets/2d/icons && test -f www/assets/2d/mascot/chameleon.svg
