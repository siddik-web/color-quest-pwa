name: Quality checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    name: Web assets and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run smoke tests
        run: npm test
      - name: Build Capacitor web bundle
        run: npm run web
      - name: Verify bundled artwork
        run: test -d www/assets/2d/icons && test -f www/assets/2d/mascot/chameleon.svg
