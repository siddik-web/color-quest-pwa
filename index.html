<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14172b">
<meta name="description" content="Color Quest: a daily colour-sorting puzzle. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Color Quest</title>
<style>
:root{--bg:#14172b;--panel:#1f2340;--text:#f2f4ff;--muted:#9aa0c8;--accent:#ffd24a;--glass:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto;padding:max(env(safe-area-inset-top),var(--safe-area-inset-top,0px)) 14px max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
h1{font-size:18px;margin:0;letter-spacing:.5px}
.chips{display:flex;gap:6px}
.chip{background:var(--panel);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text)}
nav{display:flex;gap:8px;margin:6px 0 10px}
nav button{flex:1;padding:10px 2px;min-width:0}
#mDaily,#mEndless{flex:1.8}
button{font:inherit;color:var(--text);background:var(--panel);border:0;border-radius:12px;padding:10px 12px;cursor:pointer}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#1b1b1b;font-weight:700}
button:disabled{opacity:.4}
#info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:2px 4px 8px}
#levelMapBtn{padding:6px 10px;font-size:12px;white-space:nowrap}
#levelGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0;max-height:48vh;overflow:auto}
.level-tile{min-height:58px;padding:7px 3px;border-radius:12px;background:var(--glass);border:1px solid #ffffff25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800}
.level-tile small{font-size:10px;color:var(--muted)}
.level-tile.current{outline:2px solid var(--accent);background:#ffd24a22}
.level-tile.locked{opacity:.35;filter:grayscale(1)}
.level-tile.completed{border-color:#7dffb0}
#board{flex:1;display:flex;flex-wrap:wrap;gap:22px 14px;justify-content:center;align-content:center;padding:10px 0}
.bottle{width:var(--bw,48px);height:var(--bh,168px);border:3px solid rgba(255,255,255,.55);border-top-color:rgba(255,255,255,.25);border-radius:6px 6px 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;padding:3px;gap:2px;position:relative}
.bottle.sel{transform:translateY(-18px);animation:lift .15s ease-out}
.bottle.land{animation:land .26s ease-out;z-index:5}
@keyframes land{from{transform:translate(var(--tx),var(--ty)) rotate(var(--rot))}to{transform:none}}
.seg.fill{animation:fillIn .3s ease-out;transform-origin:bottom}
@keyframes fillIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stream{position:fixed;width:6px;border-radius:3px;transform-origin:top;animation:streamIn .22s ease-out forwards;z-index:4;pointer-events:none}
@keyframes streamIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bottle.land,.seg.fill,.stream,.bottle.sel{animation:none}}
@keyframes lift{from{transform:translateY(0)}to{transform:translateY(-18px)}}
.bottle.done{border-color:#7dffb0;box-shadow:0 0 12px #7dffb066}
.seg{flex:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:rgba(0,0,0,.65)}
.seg:first-child{border-bottom-left-radius:18px;border-bottom-right-radius:18px}
.noshape .seg span{display:none}
footer{display:flex;gap:8px;padding:10px 0 14px}
footer button{flex:1;min-width:0;padding:10px 2px;font-size:13px;white-space:nowrap}
dialog{background:var(--panel);color:var(--text);border:0;border-radius:18px;padding:22px;max-width:340px;width:88%;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px}
.stars{font-size:36px;letter-spacing:4px;margin:8px 0}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1}
#journeySummary{margin:8px 0;padding:10px;border-radius:12px;background:var(--glass);font-size:13px;font-weight:700;color:#e7eeff}
#journeyPath{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:8px 0 14px}
.journey-day{min-width:0;padding:7px 2px;border-radius:9px;background:var(--glass);text-align:center;font-size:10px;color:var(--muted)}
.journey-day b{display:block;font-size:15px;color:var(--text);margin:3px 0}
.journey-day.done{background:#245d4a;color:#b9ffd4}
.journey-day.done b{color:#b9ffd4}
.journey-day.today{outline:2px solid var(--accent)}
.journey-day.missed{opacity:.45}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;font-size:12px}
#cal div{aspect-ratio:1;border-radius:6px;background:var(--glass);display:flex;align-items:center;justify-content:center;color:var(--muted)}
#cal div.won{background:#4cd98a;color:#0b2a1a;font-weight:700}
#cal div.today{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#lvrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 2px 4px}
#lvrow .bar{flex:1;height:7px;background:var(--glass);border-radius:99px;overflow:hidden}
#lvrow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7dffb0,var(--accent));border-radius:99px;transition:width .4s}
.shoprow{display:flex;align-items:center;gap:10px;margin:10px 0;text-align:left}
.shoprow .sw{display:flex;gap:3px;padding:8px;border-radius:10px;flex:0 0 auto}
.shoprow .sw i{width:9px;height:22px;border-radius:3px;display:block}
.shoprow .nm{flex:1;font-weight:700}
.shoprow button{flex:0 0 auto;min-width:92px}
#achList{max-height:48vh;overflow:auto;margin-top:8px}
.achrow{display:flex;gap:10px;align-items:center;text-align:left;margin:8px 0;opacity:.45}
.achrow.ok{opacity:1}
.achrow .ic{font-size:26px;width:34px;text-align:center}
.achrow small{color:var(--muted)}
#drGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.dr{background:var(--glass);border-radius:10px;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center}
.dr b{font-size:16px}
.dr.got{opacity:.45}
.dr.now{outline:2px solid var(--accent);background:rgba(255,210,74,.15)}
#confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
</style>
<style>
/* Color Quest 2D graphics refresh */
:root{--bg:#172044;--panel:#263568;--text:#f7f8ff;--muted:#bbc7ee;--accent:#ffd24a;--glass:rgba(255,255,255,.14)}
html,body{background:radial-gradient(ellipse at 50% 12%,#354b91 0%,#19254e 52%,#10172f 100%);background-attachment:fixed}
#app{background-image:radial-gradient(circle at 12% 24%,#ffffff12 0 2px,transparent 3px),radial-gradient(circle at 88% 42%,#ffffff12 0 3px,transparent 4px);background-size:120px 150px,170px 190px}
h1{font-size:21px;font-weight:900;letter-spacing:.2px;text-shadow:0 2px 0 #101a42,0 4px 14px #0008}
.chip{background:linear-gradient(180deg,#5269b2,#293b76);border:1px solid #91a9ed;border-bottom-width:3px;color:#e7eeff;box-shadow:0 3px 8px #0003}
nav button,footer button{background:linear-gradient(180deg,#536dc0,#344988);border:1px solid #9bb8ff;border-bottom:4px solid #1c2c61;box-shadow:0 4px 8px #0004;text-shadow:0 1px 2px #18214a}
nav button.on,button.on{background:linear-gradient(180deg,#fff09b,#ffbe31);border-color:#fff3b6;border-bottom-color:#b97413;color:#422708;text-shadow:none;box-shadow:0 4px 10px #0004}
button:disabled{filter:saturate(.55)}
#board{filter:drop-shadow(0 8px 12px #0002)}
.bottle{border:4px solid #d9edff;border-top:4px solid #f5fbff;border-radius:14px 14px 25px 25px;background:linear-gradient(90deg,#ffffff55,#b9e1ff18 22%,#ffffff08 65%,#ffffff44);box-shadow:inset 4px 0 7px #fff7,inset -4px 0 8px #8ab8e866,0 5px 12px #0004;overflow:hidden}
.bottle:before{content:"";position:absolute;left:-5px;right:-5px;top:-5px;height:12px;border-radius:50%;background:linear-gradient(180deg,#fff,#b8d4f5);border:2px solid #eff8ff;box-shadow:0 2px 5px #0004}
.bottle.sel{box-shadow:0 0 0 3px #ffdf63,0 12px 18px #0005,inset 4px 0 7px #fff7}
.bottle.done{border-color:#91ffb7;box-shadow:0 0 18px #7dffb088,inset 4px 0 7px #fff7}
.seg{border-radius:7px;box-shadow:inset 0 3px 4px #ffffff66,inset 0 -3px 4px #0002,0 1px 2px #0002}
.seg:first-child{border-bottom-left-radius:18px;border-bottom-right-radius:18px}
#info{font-weight:700;color:#d5defd}
footer button{font-weight:750;font-size:12px}
dialog{background:linear-gradient(145deg,#354a8d,#1d2b5a);border:2px solid #859fe9;box-shadow:0 18px 55px #0008}
dialog h2{font-weight:900;text-shadow:0 2px 5px #0004}
@media(max-width:380px){nav{gap:5px}nav button{font-size:11px;padding:9px 1px}footer{gap:5px}footer button{font-size:11px}}
</style>
<style>

/* Final polish: custom vector controls, mobile safe-area and tactile feedback */
.brand-mascot{width:34px;height:30px;object-fit:contain;vertical-align:middle;margin-right:5px;filter:drop-shadow(0 2px 3px #101a42)}
.nav-icon{display:block;width:27px;height:27px;margin:0 auto;filter:drop-shadow(0 2px 2px #101a42)}
.action-icon{width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:5px;filter:drop-shadow(0 1px 1px #14204a)}
nav button[aria-label]{display:flex;align-items:center;justify-content:center;min-height:48px}
footer{flex-shrink:0;align-items:stretch;padding:10px 0 max(16px,env(safe-area-inset-bottom))}
footer button{display:flex;align-items:center;justify-content:center;gap:2px;min-height:46px;border-radius:14px}
#board{min-height:190px;min-width:0}
.bottle{isolation:isolate}
.bottle:after{content:"";position:absolute;z-index:2;left:5px;top:13px;bottom:12px;width:5px;border-radius:99px;background:linear-gradient(180deg,#fff9,#fff1 65%,transparent);pointer-events:none}
.bottle.sel{outline:2px solid #ffe477;outline-offset:3px;filter:drop-shadow(0 8px 10px #ffdc6955)}
.seg{position:relative;overflow:hidden}
.seg:after{content:"";position:absolute;left:5px;right:5px;top:2px;height:4px;border-radius:99px;background:#fff6}
.stream{width:7px;filter:drop-shadow(0 0 4px var(--liquid));border:1px solid #ffffff55;background:linear-gradient(90deg,#ffffff55,var(--liquid),#ffffff88);box-shadow:0 0 9px var(--liquid);transform-origin:top center;overflow:hidden}
.stream:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:streamShimmer .32s linear infinite}
@keyframes streamShimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bottle.pouring{z-index:6;transform-origin:50% 12%;filter:drop-shadow(0 10px 10px #0006)}
.bottle.receiving{animation:receive .38s cubic-bezier(.2,.8,.2,1)}
@keyframes receive{0%,100%{filter:brightness(1)}35%{filter:brightness(1.32) drop-shadow(0 0 9px var(--accent))}}
@media(prefers-reduced-motion:reduce){.stream:after{animation:none}.bottle.receiving{animation:none}}
#win[open]{animation:popIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
button:focus-visible,.bottle:focus-visible{outline:3px solid #fff1a8;outline-offset:3px}
@media(max-height:700px){#board{min-height:150px;gap:14px 10px}.bottle{max-height:min(var(--bh),27vh)}header{padding-top:7px}nav{margin:4px 0 7px}footer{padding-top:6px}}
@media(max-width:380px){.brand-mascot{width:29px;height:26px}.action-icon{width:17px;height:17px;margin-right:2px}footer button{font-size:11px}.nav-icon{width:24px;height:24px}}
@media(prefers-reduced-motion:reduce){#win[open]{animation:none}button:active{transform:none}}

</style>
</head>
<body>
<div id="app">
  <header>
    <h1><img class="brand-mascot" src="assets/2d/mascot/chameleon.svg" alt="">Color Quest</h1>
    <div class="chips"><span class="chip">🔥 <b id="streak">0</b></span><span class="chip">⭐ <b id="stars">0</b></span><span class="chip">🪙 <b id="coins">0</b></span></div>
  </header>
  <div id="lvrow"><span id="plv"></span><div class="bar"><i id="xpfill"></i></div><span id="xptxt"></span></div>
  <nav>
    <button id="mDaily" class="on">Daily</button>
    <button id="mEndless">Endless</button>
    <button id="mCal" aria-label="Calendar"><img class="nav-icon" src="assets/2d/icons/calendar.svg" alt=""></button>
    <button id="mAch" aria-label="Trophies"><img class="nav-icon" src="assets/2d/icons/trophy.svg" alt=""></button>
    <button id="mShop" aria-label="Shop"><img class="nav-icon" src="assets/2d/icons/shop.svg" alt=""></button>

  <div id="board"></div>
  <footer>
    <button id="undo"><img class="action-icon" src="assets/2d/icons/undo.svg" alt="">Undo</button>
    <button id="hint"><img class="action-icon" src="assets/2d/icons/hint.svg" alt="">Hint</button>
    <button id="restart"><img class="action-icon" src="assets/2d/icons/reset.svg" alt="">Reset</button>
    <button id="bottle"><img class="action-icon" src="assets/2d/icons/extra-bottle.svg" alt="">+1 · 30🪙</button>

</div>

<dialog id="win">
  <h2 id="winTitle">Solved!</h2>
  <div class="stars" id="winStars"></div>
  <div id="winText" style="color:var(--muted)"></div>
  <div class="row"><button id="doubleBtn" hidden>📺 Double coins</button></div>
  <div class="row"><button id="share">Share</button><button id="next" class="on">Continue</button></div>
</dialog>

<dialog id="calDlg">
  <h2 id="calTitle"></h2>
  <div id="journeySummary"></div>
  <div id="journeyPath" aria-label="Recent daily challenge journey"></div>
  <div id="cal"></div>
  <div class="row"><button id="calClose" class="on">Close</button></div>
</dialog>

<dialog id="levelDlg">
  <h2>🗺 Level Journey</h2>
  <div id="levelSummary" style="color:var(--muted);font-size:13px"></div>
  <div id="levelGrid" aria-label="Endless level selection"></div>
  <div class="row"><button id="levelClose" class="on">Close</button></div>
</dialog>

<dialog id="setDlg">
  <h2>Settings</h2>
  <div class="row"><button id="install" hidden>⬇ Install app</button></div>
  <div class="row"><button id="privBtn" hidden>Ad privacy choices</button></div>
  <div class="row"><button id="sndBtn">Sound: On</button></div>
  <div class="row"><button id="cbBtn">Colour-blind symbols</button></div>
  <div class="row"><button id="resetBtn">Reset progress</button></div>
  <div class="row"><button id="setClose" class="on">Close</button></div>
</dialog>

<dialog id="adDlg">
  <h2>📺 Need coins?</h2>
  <div id="adMsg" style="color:var(--muted)"></div>
  <div class="row"><button id="adNo">Not now</button><button id="adYes" class="on">Watch ad</button></div>
</dialog>

<dialog id="shopDlg">
  <h2>🛍️ Shop</h2>
  <div style="color:var(--muted)">Your coins: 🪙 <b id="shopCoins" style="color:var(--text)">0</b></div>
  <div id="shopList"></div>
  <div class="row"><button id="adBtn" hidden>📺 Watch ad: +30 🪙</button></div>
  <div class="row"><button id="shopClose" class="on">Close</button></div>
</dialog>

<dialog id="achDlg">
  <h2>🏆 Trophies</h2>
  <div id="achStats" style="color:var(--muted);font-size:13px"></div>

</dialog>

<dialog id="drDlg">
  <h2>🎁 Daily reward</h2>
  <div id="drText" style="color:var(--muted)"></div>
  <div id="drGrid"></div>
  <div class="row"><button id="drClaim" class="on">Claim</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";
const CAP = 4;
let COLORS = ["#ff5a5f","#ffa63d","#ffe14d","#7ddc4a","#27c3a6","#3fa7ff","#6c63ff","#c05cff","#ff6fb5","#9a6b45","#9aa3b2","#1fd1ff"];
const SYMBOLS = ["●","▲","■","◆","★","✚","♥","☾","✖","▼","◐","☀"];
const DAILY_COLORS = [7,5,6,7,6,8,9]; // Sun..Sat
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- storage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("cq."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cq."+k, JSON.stringify(v)); }catch(e){} }
};
const DEF = { streak:0, best:0, last:null, won:{}, stars:0, level:1, cb:false, snd:true,
  coins:0, xp:0, plv:1, theme:"classic", owned:{classic:true}, ach:{}, stats:{wins:0,perfect:0,nohint:0,daily:0}, dr:{last:null,day:0}, levelResults:{} };
let save = Object.assign(JSON.parse(JSON.stringify(DEF)), LS.get("save", {}));
save.stats = Object.assign({}, DEF.stats, save.stats); save.owned = Object.assign({classic:true}, save.owned); save.ach = save.ach || {}; save.dr = Object.assign({}, DEF.dr, save.dr); save.levelResults = save.levelResults || {};

/* ---------- sound (synthesised with WebAudio, no files) ---------- */
const sfx = (()=>{
  let ctx = null, master = null;
  const on = ()=> save.snd !== false;
  function init(){
    if(ctx) return true;
    try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .28; master.connect(ctx.destination); }catch(e){ return false; }
    return true;
  }
  function ready(){ if(!on() || !init()) return false; if(ctx.state === "suspended") ctx.resume(); return true; }
  function tone(f, t0, dur, type, vol, f2){
    const now = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now + t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, now + t0 + dur);
    g.gain.setValueAtTime(.0001, now + t0); g.gain.exponentialRampToValueAtTime(vol, now + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, now + t0 + dur);
    o.connect(g); g.connect(master); o.start(now + t0); o.stop(now + t0 + dur + .02);
  }
  function pour(){
    if(!ready()) return;
    const dur = .55, len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.5;
    bp.frequency.setValueAtTime(500, ctx.currentTime); bp.frequency.linearRampToValueAtTime(1400, ctx.currentTime + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, ctx.currentTime); g.gain.linearRampToValueAtTime(.55, ctx.currentTime + .12); g.gain.linearRampToValueAtTime(.0001, ctx.currentTime + dur);
    src.connect(bp); bp.connect(g); g.connect(master); src.start();
  }
  return {
    select(){ if(ready()) tone(620, 0, .07, "sine", .35); },
    bad(){ if(ready()) tone(170, 0, .12, "square", .18, 110); },
    undo(){ if(ready()) tone(420, 0, .09, "triangle", .3, 260); },
    pour,
    done(){ if(!ready()) return; tone(880, 0, .18, "sine", .3); tone(1320, .09, .25, "sine", .28); },
    win(){ if(!ready()) return; [523.25, 659.25, 783.99, 1046.5].forEach((f,k)=>tone(f, k*.11, .3, "triangle", .35)); }
  };
})();
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------- seeded RNG ---------- */
function hash(str){ let h = 1779033703 ^ str.length; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return h>>>0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

/* ---------- puzzle core ---------- */
const topOf = b => b.length ? b[b.length-1] : -1;
function topRun(b){ if(!b.length) return 0; const c = topOf(b); let n = 0; for(let i=b.length-1;i>=0&&b[i]===c;i--) n++; return n; }
function canPour(a, b){ if(!a.length || b.length>=CAP) return false; if(b.length && topOf(b)!==topOf(a)) return false; if(!b.length && a.every(x=>x===a[0])) return false; return true; }
function pour(state, i, j){ const a = state[i], b = state[j]; const n = Math.min(topRun(a), CAP-b.length); for(let k=0;k<n;k++) b.push(a.pop()); return n; }
const isSolved = s => s.every(b => b.length===0 || (b.length===CAP && b.every(x=>x===b[0])));
const key = s => s.map(b=>b.join("")).sort().join("|");

function solve(start, cap=60000, rnd=null){
  const seen = new Set([key(start)]); let nodes = 0;
  function dfs(s, path){
    if(isSolved(s)) return path;
    if(++nodes > cap) return null;
    const moves = [];
    for(let i=0;i<s.length;i++) for(let j=0;j<s.length;j++){
      if(i===j || !canPour(s[i], s[j])) continue;
      const score = (s[j].length? 10:0) + topRun(s[i]) + (s[i].length===topRun(s[i])? 3:0) + (rnd? rnd()*6 : 0);
      moves.push([score,i,j]);
    }
    moves.sort((x,y)=>y[0]-x[0]);
    for(const [,i,j] of moves){
      const t = s.map(b=>b.slice()); pour(t,i,j);
      const k = key(t); if(seen.has(k)) continue; seen.add(k);
      const r = dfs(t, path.concat([[i,j]])); if(r) return r;
    }
    return null;
  }
  return dfs(start.map(b=>b.slice()), []);
}

function levelColorCount(level){ return Math.min(4 + Math.floor((Math.max(1, level)-1)/3), 11); }
function difficultyForLevel(level){
  if(level <= 6) return "Easy";
  if(level <= 12) return "Medium";
  if(level <= 18) return "Hard";
  return "Expert";
}

function generate(seedStr, nColors){
  for(let attempt=0; attempt<50; attempt++){
    const rnd = mulberry32(hash(seedStr + ":" + attempt));
    const pool = []; for(let c=0;c<nColors;c++) for(let k=0;k<CAP;k++) pool.push(c);
    for(let i=pool.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
    const bottles = []; for(let i=0;i<nColors;i++) bottles.push(pool.slice(i*CAP,(i+1)*CAP));
    bottles.push([],[]);
    if(isSolved(bottles)) continue;
    let sol = solve(bottles);
    if(sol){
      // try several differently-ordered searches and keep the shortest solution as par
      for(let k=0;k<24;k++){ const alt = solve(bottles, 15000, mulberry32(hash(seedStr+":alt"+k))); if(alt && alt.length < sol.length) sol = alt; }
      return { bottles, par: sol.length };
    }
  }
  // fallback (should not happen): plain deal with a loose par
  const pool = []; for(let c=0;c<nColors;c++) for(let k=0;k<CAP;k++) pool.push(c);
  const bottles = []; for(let i=0;i<nColors;i++) bottles.push(pool.slice(i*CAP,(i+1)*CAP));
  bottles.push([],[]); bottles[0].reverse();
  return { bottles, par: nColors*4 };
}

/* ---------- game state ---------- */
let busy = false, fx = null, hintsUsed = 0, extraBottles = 0, hintPaid = "";
let mode = "daily", puzzleDate = "", seedStr = "", puzzle = null, state = [], history = [], sel = -1, moves = 0, finished = false, selectedLevel = null;

const $ = id => document.getElementById(id);
function dateKey(d=new Date()){ const p = n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("show"),1600); }

function dailyProgressKey(day=puzzleDate){ return "daily-progress-" + day; }
function persistDailyProgress(){
  if(mode!=="daily" || !puzzleDate || finished || save.won[puzzleDate]) return;
  LS.set(dailyProgressKey(), { version:1, state:state.map(b=>b.slice()), moves, history:history.map(h=>h.map(b=>b.slice())), hintsUsed, extraBottles, hintPaid, updatedAt:Date.now() });
}
function clearDailyProgress(day=puzzleDate){ try{ localStorage.removeItem("cq."+dailyProgressKey(day)); }catch(e){} }
function restoreDailyProgress(){
  if(mode!=="daily" || save.won[puzzleDate]) return false;
  const p=LS.get(dailyProgressKey(),null);
  if(!p || p.version!==1 || !Array.isArray(p.state) || p.state.length!==puzzle.bottles.length+(p.extraBottles?1:0) || !p.state.every(b=>Array.isArray(b)&&b.length<=CAP&&b.every(c=>Number.isInteger(c)&&c>=0&&c<COLORS.length)) || !Number.isInteger(p.moves)||p.moves<0) return false;
  state=p.state.map(b=>b.slice()); moves=p.moves;
  history=Array.isArray(p.history)?p.history.filter(h=>Array.isArray(h)&&h.length===puzzle.bottles.length+(p.extraBottles?1:0)&&h.every(b=>Array.isArray(b)&&b.length<=CAP&&b.every(c=>Number.isInteger(c)&&c>=0&&c<COLORS.length))).map(h=>h.map(b=>b.slice())):[];
  hintsUsed=Number.isInteger(p.hintsUsed)&&p.hintsUsed>=0?p.hintsUsed:0; extraBottles=p.extraBottles?1:0; hintPaid=typeof p.hintPaid==="string"?p.hintPaid:"";
  return true;
}

function startGame(m, levelOverride=null){
  mode = m; finished = false; sel = -1; moves = 0; history = []; plan = null; hintsUsed = 0; extraBottles = 0; hintPaid = "";
  selectedLevel = m==="endless" ? Math.max(1, Number(levelOverride || save.level) || 1) : null;
  let n;
  if(m==="daily"){
    const d = new Date(); puzzleDate = dateKey(d); seedStr = "daily-" + puzzleDate; n = DAILY_COLORS[d.getDay()];
    $("title").textContent = WEEKDAYS[d.getDay()] + " · " + dateKey(d);
  } else {
    const lv = selectedLevel; seedStr = "level-" + lv; n = levelColorCount(lv);
    $("title").textContent = "Level " + lv + " · " + difficultyForLevel(lv);
  }
  puzzle = generate(seedStr, n);
  state = puzzle.bottles.map(b=>b.slice());
  const resumed = restoreDailyProgress();
  $("mDaily").classList.toggle("on", m==="daily"); $("mEndless").classList.toggle("on", m==="endless");
  $("levelMapBtn").hidden = m!=="endless";
  render();
  if(resumed) toast("Daily challenge resumed");
  else if(m==="daily") persistDailyProgress();
}

function render(){
  const board = $("board"); board.innerHTML = "";
  board.classList.toggle("noshape", !save.cb);
  { const n = state.length, z = n<=6 ? [60,204] : n<=8 ? [54,186] : [48,168]; board.style.setProperty("--bw", z[0]+"px"); board.style.setProperty("--bh", z[1]+"px"); }
  state.forEach((b,i)=>{
    const el = document.createElement("div");
    el.className = "bottle" + (i===sel?" sel":"") + (b.length===CAP && b.every(x=>x===b[0])?" done":"");
    b.forEach((c,si)=>{ const s = document.createElement("div"); s.className = "seg" + (fx && fx.to===i && si >= b.length - fx.n ? " fill" : ""); s.style.background = COLORS[c]; s.innerHTML = "<span>"+SYMBOLS[c]+"</span>"; el.appendChild(s); });
    if(fx && fx.from===i){ el.classList.add("land"); el.style.setProperty("--tx", fx.tx+"px"); el.style.setProperty("--ty", fx.ty+"px"); el.style.setProperty("--rot", fx.rot+"deg"); }
    el.setAttribute("role","button"); el.setAttribute("aria-label","Bottle "+(i+1)+(b.length? ", "+b.length+" layers":", empty")); el.addEventListener("click", ()=>tap(i));
    board.appendChild(el);
  });
  fx = null;
  $("moves").textContent = "Moves " + moves + " · Par " + (puzzle? puzzle.par : "-");
  $("undo").disabled = !history.length;
  hud();
}

function tap(i){
  if(finished || busy) return;
  if(sel === -1){ if(state[i].length) { sel = i; sfx.select(); render(); } return; }
  if(sel === i){ sel = -1; sfx.select(); render(); return; }
  if(canPour(state[sel], state[i])){ doPour(sel, i); }
  else if(state[i].length){ sel = i; sfx.select(); render(); }
  else { sel = -1; sfx.bad(); render(); }
}

function doPour(a, b){
  busy = true;
  history.push(state.map(x=>x.slice()));
  const color = topOf(state[a]);
  const els = $("board").children, sEl = els[a], tEl = els[b];
  let tx = 0, ty = 0, rot = 0;
  const finish = ()=>{
    const n = pour(state, a, b); moves++; sel = -1;
    fx = REDUCED ? null : { from:a, to:b, n, tx, ty, rot };
    busy = false; render();
    if(navigator.vibrate) navigator.vibrate(15);
    const full = state[b].length === CAP && state[b].every(x=>x===state[b][0]);
    if(isSolved(state)) win(); else { persistDailyProgress(); if(full) sfx.done(); }
  };
  if(REDUCED || !sEl || !tEl){ sfx.pour(); finish(); return; }
  sEl.classList.remove("sel");
  sEl.classList.add("pouring");
  const sr = sEl.getBoundingClientRect(), tr = tEl.getBoundingClientRect();
  const dir = (tr.left + tr.width/2) >= (sr.left + sr.width/2) ? 1 : -1;
  rot = dir * 65;
  const mouthX = Math.sin(rot*Math.PI/180) * sr.height/2 * dir * dir;
  tx = (tr.left + tr.width/2) - (sr.left + sr.width/2) - Math.abs(mouthX) * dir;
  ty = (tr.top - 14) - (sr.top + sr.height/2) + Math.cos(rot*Math.PI/180) * sr.height/2;
  sEl.style.zIndex = 5; sEl.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)";
  sEl.style.transform = "translate("+tx+"px,"+ty+"px) rotate("+rot+"deg)";
  sfx.pour();
  const stream = document.createElement("div");
  const streamTimer = setTimeout(()=>{
    stream.className = "stream";
    stream.style.setProperty("--liquid", COLORS[color]);
    stream.style.left = (tr.left + tr.width/2 - 3) + "px";
    stream.style.top = (tr.top - 10) + "px";
    stream.style.height = Math.max(24, tr.height * .75) + "px";
    tEl.classList.add("receiving");
    document.body.appendChild(stream);
  }, 280);
  setTimeout(()=>{
    clearTimeout(streamTimer);
    stream.remove();
    finish();
  }, 650);
}

function starsFor(m, par){ return m <= Math.ceil(par*1.1) ? 3 : m <= par*1.5 ? 2 : 1; }

function win(){
  finished = true;
  const st = starsFor(moves, puzzle.par);
  const flawless = hintsUsed === 0 && extraBottles === 0;
  let coins = 0, xp = 0, note = "", fresh = true;
  if(mode==="daily"){
    const k = puzzleDate;
    if(!save.won[k]){
      save.stars += st;
      const prev = new Date(k+"T12:00:00"); prev.setDate(prev.getDate()-1);
      save.streak = (save.last === dateKey(prev)) ? save.streak+1 : 1;
      save.last = k; save.best = Math.max(save.best, save.streak);
      save.won[k] = { moves, stars: st };
      save.stats.daily++;
      coins = 25 + st*10 + Math.min(save.streak,7)*5; xp = 40 + st*15;
      note = "Streak: " + save.streak + " 🔥 (best " + save.best + ")";
    } else { fresh = false; note = "Practice run: today's result is already saved."; }
    $("next").textContent = "Done";
  } else {
    const completedLevel = selectedLevel || save.level;
    const previous = save.levelResults[String(completedLevel)];
    if(!previous){
      save.levelResults[String(completedLevel)] = { stars:st, moves, bestMoves:moves };
      save.stars += st;
      coins = 10 + st*5; xp = 20 + st*10;
      if(completedLevel === save.level) save.level = completedLevel + 1;
      note = "Unlocked: Level " + save.level;
    } else {
      previous.stars = Math.max(previous.stars || 0, st);
      previous.bestMoves = Math.min(previous.bestMoves || moves, moves);
      note = "Replay complete · best " + previous.bestMoves + " moves";
      fresh = false;
    }
    $("next").textContent = "Continue";
  }
  let rewardLine = "";
  if(fresh){
    if(st===3) coins += 10;
    if(flawless){ coins += 10; save.stats.nohint++; }
    save.stats.wins++; if(st===3) save.stats.perfect++;
    save.coins += coins;
    const ups = addXp(xp);
    rewardLine = "<br>+" + coins + " 🪙 · +" + xp + " XP" + (flawless ? " · no-help bonus" : "");
    if(ups) note += "<br>⬆ Level up! You are Lv " + save.plv + " " + titleOf(save.plv) + " (+" + (ups*20) + " 🪙)";
    const got = checkAch(false);
    if(got.length) note += "<br>🏆 " + got.map(x=>x.icon+" "+x.name).join(", ") + " (+" + (got.length*25) + " 🪙)";
  }
  LS.set("save", save); clearDailyProgress(); render();
  $("winTitle").textContent = st===3 ? "Perfect!" : "Solved!";
  $("winStars").textContent = "⭐".repeat(st) + "☆".repeat(3-st);
  $("winText").innerHTML = moves + " moves (par " + puzzle.par + ")" + rewardLine + "<br>" + note;
  lastWinCoins = fresh ? coins : 0;
  const dbl = $("doubleBtn"); dbl.hidden = !(lastWinCoins > 0 && Ads.enabled && Ads.rReady); dbl.textContent = "📺 Double coins (+" + lastWinCoins + " 🪙)";
  sfx.win();
  $("win").showModal();
  if(st>=2) confetti();
}

/* ---------- controls ---------- */
$("undo").onclick = ()=>{ if(busy||!history.length||finished) return; sfx.undo(); state = history.pop(); moves = Math.max(0,moves-1); sel=-1; persistDailyProgress(); render(); };
$("restart").onclick = ()=>{ if(busy) return; plan = null; state = puzzle.bottles.map(b=>b.slice()); if(extraBottles) state.push([]); history=[]; moves=0; sel=-1; finished=false; persistDailyProgress(); render(); };
/* hints follow one cached plan so repeated hints always make progress (no oscillating suggestions) */
let plan = null;
const exactKey = st => st.map(b=>b.join("")).join("|");
function nextHint(){
  let idx = plan ? plan.keys.indexOf(exactKey(state)) : -1;
  if(idx < 0 || idx >= plan.mv.length){
    const mv = solve(state, 20000); if(!mv || !mv.length) return null;
    const keys = [], t = state.map(b=>b.slice()); keys.push(exactKey(t));
    for(const [i,j] of mv){ pour(t,i,j); keys.push(exactKey(t)); }
    plan = { mv, keys }; idx = 0;
  }
  return plan.mv[idx];
}
$("hint").onclick = ()=>{
  if(finished || busy) return;
  const m = nextHint();
  if(!m){ toast("No hint available"); return; }
  const k = exactKey(state), cost = (hintsUsed === 0 || hintPaid === k) ? 0 : 5;
  if(cost && save.coins < cost){ offerAd("Need 5 🪙 for another hint."); return; }
  if(cost){ save.coins -= cost; LS.set("save", save); }
  if(hintPaid !== k){ hintsUsed++; hintPaid = k; }
  persistDailyProgress();
  const [i,j] = m; sel = i; render();
  const t = $("board").children[j]; if(t){ t.style.outline = "3px dashed #ffd24a"; t.style.outlineOffset = "3px"; setTimeout(()=>{ t.style.outline = ""; }, 1200); }
};
$("mDaily").onclick = ()=>{ if(!busy) startGame("daily"); };
$("mEndless").onclick = ()=>{ if(!busy) startGame("endless"); };
function renderLevelMap(){
  const grid=$("levelGrid"); grid.innerHTML="";
  const max=Math.max(30,save.level+5);
  $("levelSummary").textContent="Level "+save.level+" is unlocked · "+Object.keys(save.levelResults).length+" completed";
  for(let level=1;level<=max;level++){
    const result=save.levelResults[String(level)], unlocked=level<=save.level;
    const tile=document.createElement("button");
    tile.className="level-tile"+(level===save.level?" current":"")+(result?" completed":"")+(unlocked?"":" locked");
    tile.disabled=!unlocked;
    tile.innerHTML="<span>"+(unlocked?level:"🔒")+"</span><small>"+(result?"★".repeat(result.stars||0):unlocked?"Play":"Locked")+"</small>";
    tile.setAttribute("aria-label",unlocked?"Play level "+level+(result?", completed":""):"Level "+level+" locked");
    tile.onclick=()=>{ $("levelDlg").close(); startGame("endless",level); };
    grid.appendChild(tile);
  }
}
$("levelMapBtn").onclick=()=>{ renderLevelMap(); $("levelDlg").showModal(); };
$("levelClose").onclick=()=>$("levelDlg").close();
$("next").onclick = ()=>$("win").close();
$("win").addEventListener("close", ()=>{ if(finished && mode==="endless"){ startGame("endless"); if(save.level > ADS_CONFIG.interstitialEvery && (save.level-1) % ADS_CONFIG.interstitialEvery === 0) Ads.interstitial(); } });
$("share").onclick = async ()=>{
  const st = starsFor(moves, puzzle.par);
  const text = "Color Quest " + (mode==="daily"? dateKey() : "Level "+(save.level-1)) + "\n" + "⭐".repeat(st) + "☆".repeat(3-st) + " · " + moves + " moves (par " + puzzle.par + ")" + (mode==="daily" ? "\n🔥 " + save.streak : "");
  try{ if(NATIVE && window.CQNative) await window.CQNative.Share.share({ text }); else if(navigator.share) await navigator.share({text}); else { await navigator.clipboard.writeText(text); toast("Copied!"); } }catch(e){}
};

function renderDailyJourney(){
  const today=dateKey(), base=new Date(today+"T12:00:00");
  const path=$("journeyPath"); path.innerHTML="";
  let completed=0;
  for(let offset=6;offset>=0;offset--){
    const d=new Date(base); d.setDate(d.getDate()-offset); const k=dateKey(d), result=save.won[k];
    if(result) completed++;
    const el=document.createElement("div");
    el.className="journey-day"+(result?" done":"")+(k===today?" today":"")+(k<today&&!result?" missed":"");
    const status=result ? "★".repeat(result.stars||0) : k===today ? (LS.get(dailyProgressKey(k),null)?"↻":"Today") : "—";
    el.innerHTML="<small>"+d.toLocaleDateString(undefined,{weekday:"short"})+"</small><b>"+d.getDate()+"</b><span>"+status+"</span>";
    el.title=result ? k+" · "+result.moves+" moves · "+result.stars+" stars" : k===today ? "Today's challenge" : k;
    path.appendChild(el);
  }
  $("journeySummary").textContent=save.streak+" day streak 🔥 · "+Object.keys(save.won).length+" daily challenges completed · last 7 days: "+completed+"/7";
}

/* ---------- progression: coins, XP, trophies, themes, daily reward ---------- */
const TITLES = ["Rookie","Mixer","Sorter","Pourer","Alchemist","Mastermind","Legend"];
const xpNeed = l => 80 + (l-1)*40;
const titleOf = l => TITLES[Math.min(TITLES.length-1, Math.floor((l-1)/3))];
function addXp(n){ save.xp += n; let ups = 0; while(save.xp >= xpNeed(save.plv)){ save.xp -= xpNeed(save.plv); save.plv++; save.coins += 20; ups++; } return ups; }
function hud(){
  $("streak").textContent = save.streak; $("stars").textContent = save.stars; $("coins").textContent = save.coins;
  $("plv").textContent = "Lv " + save.plv + " · " + titleOf(save.plv);
  $("xpfill").style.width = Math.min(100, Math.round(save.xp / xpNeed(save.plv) * 100)) + "%";
  $("xptxt").textContent = save.xp + "/" + xpNeed(save.plv) + " XP";
  $("hint").textContent = hintsUsed === 0 ? "💡 Hint" : "💡 5🪙";
  $("bottle").textContent = extraBottles ? "🧪 Added" : "🧪 +1 · 30🪙";
}

function checkAch(show){
  const got = [];
  ACH.forEach(a=>{ if(!save.ach[a.id] && a.test(save)){ save.ach[a.id] = true; save.coins += 25; got.push(a); } });
  if(got.length){ LS.set("save", save); if(show){ toast("🏆 " + got.map(a=>a.name).join(", ") + " (+25 🪙)"); sfx.done(); } }
  return got;
}
function renderAch(){
  const box = $("achList"); box.innerHTML = "";
  ACH.forEach(a=>{
    const ok = !!save.ach[a.id], el = document.createElement("div");
    el.className = "achrow" + (ok ? " ok" : "");
    el.innerHTML = '<span class="ic">' + (ok ? a.icon : "🔒") + '</span><span><b>' + a.name + '</b><br><small>' + a.desc + '</small></span>';
    box.appendChild(el);

  $("achStats").textContent = save.stats.wins + " solved · " + save.stats.perfect + " perfect · best streak " + save.best + " · " + Object.keys(save.ach).length + "/" + ACH.length + " trophies";
}

const THEMES = {
  classic:{ name:"Classic", cost:0,   bg:"#14172b", panel:"#1f2340", colors:COLORS },
  neon:   { name:"Neon",    cost:120, bg:"#08080f", panel:"#15152a", colors:["#ff2e63","#ff9f1c","#f9f871","#39ff14","#00f5d4","#00b4ff","#7b5cff","#d400ff","#ff61d8","#c98b5a","#b5bdc9","#00e5ff"] },
  candy:  { name:"Candy",   cost:200, bg:"#2b1b3d", panel:"#3a2552", colors:["#ff6b81","#ffb26b","#ffe66d","#a0e57a","#6ee7c8","#74b9ff","#a29bfe","#e17aff","#ff8fd1","#c8a07a","#cfd6e4","#7fe3ff"] },
  ocean:  { name:"Ocean",   cost:300, bg:"#06202b", panel:"#0d3342", colors:["#ff7a7a","#ffb454","#ffe27a","#7ee081","#2ed1b3","#4db8ff","#7a8cff","#b78cff","#ff8ec9","#b58863","#a9b8c6","#5ff0ff"] }
};
function applyTheme(id){
  const t = THEMES[id] || THEMES.classic; COLORS = t.colors;
  const r = document.documentElement.style; r.setProperty("--bg", t.bg); r.setProperty("--panel", t.panel);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t.bg);
  if(state.length) render();
}
/* ---------- ads: ONLY inside the Android app (AdMob). The website / PWA never shows ads. ---------- */
const ADS_CONFIG = {
  testing: true,                                           // set to false for the release build (see ANDROID.md)
  rewardedId:     "ca-app-pub-3940256099942544/5224354917", // Google's public TEST ad unit; replace with yours
  interstitialId: "ca-app-pub-3940256099942544/1033173712", // Google's public TEST ad unit; replace with yours
  interstitialEvery: 4                                      // Endless levels between interstitials
};
const NATIVE = !!(window.Capacitor && (typeof window.Capacitor.isNativePlatform === "function" ? window.Capacitor.isNativePlatform() : /; wv\)/.test(navigator.userAgent)));
const Ads = {
  enabled:false, N:null, rReady:false, iReady:false, rCb:null, rGot:false, last:0,
  loadNative(){ return new Promise(res=>{ if(window.CQNative) return res(true); const sc = document.createElement("script"); sc.src = "native.js"; sc.onload = ()=>res(true); sc.onerror = ()=>res(false); document.head.appendChild(sc); }); },
  async init(){
    if(!NATIVE) return;
    try{
      if(!(await this.loadNative())) return;
      const N = this.N = window.CQNative, A = N.AdMob, RE = N.RewardAdPluginEvents, IE = N.InterstitialAdPluginEvents;
      try{ N.SystemBars.setStyle({ style: "DARK" }); }catch(e){}
      try{ N.App.addListener("backButton", ()=>{ const o = document.querySelectorAll("dialog[open]"); if(o.length) o[o.length-1].close(); else N.App.exitApp(); }); }catch(e){}
      await A.initialize({ initializeForTesting: ADS_CONFIG.testing });
      // EU/UK consent (Google UMP): shows the consent form only where it is required
      try{
        let info = await A.requestConsentInfo();
        if(info.isConsentFormAvailable && info.status === N.AdmobConsentStatus.REQUIRED){ await A.showConsentForm(); info = await A.requestConsentInfo(); }
        $("privBtn").hidden = info.privacyOptionsRequirementStatus !== "REQUIRED";
        if(info.canRequestAds === false) return;
      }catch(e){}
      A.addListener(RE.Loaded, ()=>{ this.rReady = true; });
      A.addListener(RE.FailedToLoad, ()=>{ this.rReady = false; setTimeout(()=>this.loadRewarded(), 30000); });
      A.addListener(RE.Rewarded, ()=>{ this.rGot = true; });
      A.addListener(RE.Dismissed, ()=>{ const ok = this.rGot; this.rGot = false; this.rReady = false; this.loadRewarded(); const cb = this.rCb; this.rCb = null; if(cb) cb(ok); });
      A.addListener(RE.FailedToShow, ()=>{ this.rReady = false; this.loadRewarded(); const cb = this.rCb; this.rCb = null; if(cb) cb(false); });
      A.addListener(IE.Loaded, ()=>{ this.iReady = true; });
      A.addListener(IE.FailedToLoad, ()=>{ this.iReady = false; setTimeout(()=>this.loadInterstitial(), 60000); });
      A.addListener(IE.Dismissed, ()=>{ this.iReady = false; this.loadInterstitial(); });
      this.enabled = true; this.loadRewarded(); this.loadInterstitial();
    }catch(e){ this.enabled = false; }
  },
  loadRewarded(){ if(this.enabled) this.N.AdMob.prepareRewardVideoAd({ adId: ADS_CONFIG.rewardedId, isTesting: ADS_CONFIG.testing }).catch(()=>{}); },
  loadInterstitial(){ if(this.enabled) this.N.AdMob.prepareInterstitial({ adId: ADS_CONFIG.interstitialId, isTesting: ADS_CONFIG.testing }).catch(()=>{}); },
  /* cb(true) only when the player watched the ad to the end and earned the reward */
  rewarded(cb){
    if(!this.enabled || this.rCb){ cb(false); return; }
    if(!this.rReady){ toast("Ad not ready yet. Try again in a moment."); this.loadRewarded(); cb(false); return; }
    this.rCb = cb; this.rGot = false;
    this.N.AdMob.showRewardVideoAd().catch(()=>{ const c = this.rCb; this.rCb = null; if(c) c(false); });
  },
  /* never shown in the daily puzzle; at most one every 2 minutes */
  interstitial(){
    if(!this.enabled || !this.iReady || Date.now() - this.last < 120000) return;
    this.last = Date.now(); this.N.AdMob.showInterstitial().catch(()=>{});
  }
};
let lastWinCoins = 0;
function grantAdCoins(){ save.coins += 30; LS.set("save", save); hud(); toast("+30 🪙"); sfx.done(); }
function offerAd(msg){
  sfx.bad();
  if(Ads.enabled && Ads.rReady){ $("adMsg").textContent = msg + " Watch a short ad for 30 🪙?"; $("adDlg").showModal(); }
  else toast(msg + " Win puzzles to earn coins.");
}
$("privBtn").onclick = ()=>{ if(Ads.enabled) Ads.N.AdMob.showPrivacyOptionsForm().catch(()=>{}); };
$("adNo").onclick = ()=>$("adDlg").close();
$("adYes").onclick = ()=>{ $("adDlg").close(); Ads.rewarded(ok=>{ if(ok) grantAdCoins(); }); };
$("doubleBtn").onclick = ()=>{
  const n = lastWinCoins; if(!n) return;
  lastWinCoins = 0; $("doubleBtn").hidden = true;
  Ads.rewarded(ok=>{
    if(ok){ save.coins += n; LS.set("save", save); hud(); $("winText").innerHTML += "<br>📺 Bonus +" + n + " 🪙"; sfx.done(); }
    else { lastWinCoins = n; $("doubleBtn").hidden = false; }
  });
};
function renderShop(){
  $("shopCoins").textContent = save.coins;
  const box = $("shopList"); box.innerHTML = "";
  Object.keys(THEMES).forEach(id=>{
    const t = THEMES[id], owned = !!save.owned[id], eq = save.theme === id;
    const row = document.createElement("div"); row.className = "shoprow";
    row.innerHTML = '<div class="sw" style="background:' + t.bg + '">' + t.colors.slice(0,6).map(c=>'<i style="background:' + c + '"></i>').join("") + '</div><div class="nm">' + t.name + '</div>';
    const btn = document.createElement("button");
    btn.textContent = eq ? "Equipped" : owned ? "Equip" : "🪙 " + t.cost; btn.disabled = eq;
    btn.onclick = ()=>{
      if(!owned){
        if(save.coins < t.cost){ toast("Need " + (t.cost - save.coins) + " more 🪙"); sfx.bad(); return; }
        save.coins -= t.cost; save.owned[id] = true; checkAch(true);
      }
      save.theme = id; LS.set("save", save); applyTheme(id); hud(); renderShop(); sfx.done();
    };
    row.appendChild(btn); box.appendChild(row);
  });
  $("adBtn").hidden = !Ads.enabled;
}
$("mShop").onclick = ()=>{ renderShop(); $("shopDlg").showModal(); };
$("shopClose").onclick = ()=>$("shopDlg").close();
$("adBtn").onclick = ()=>Ads.rewarded(ok=>{ if(ok){ grantAdCoins(); renderShop(); } });
$("mAch").onclick = ()=>{ renderAch(); $("achDlg").showModal(); };
$("achClose").onclick = ()=>$("achDlg").close();

$("bottle").onclick = ()=>{
  if(busy || finished) return;
  if(extraBottles){ toast("Extra bottle already added"); return; }
  if(save.coins < 30){ offerAd("Need 30 🪙 for an extra bottle."); return; }
  save.coins -= 30; LS.set("save", save); extraBottles = 1;
  state.push([]); history.forEach(h=>h.push([])); plan = null; persistDailyProgress(); sfx.done(); render();
};

const REW = [10,15,20,25,30,40,75];
let drPending = null;
function checkDailyReward(){
  const today = dateKey(); if(save.dr.last === today || $("drDlg").open) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const day = (save.dr.last === dateKey(y)) ? (save.dr.day % 7) + 1 : 1;
  drPending = day;
  const g = $("drGrid"); g.innerHTML = "";
  REW.forEach((r,i)=>{ const el = document.createElement("div"); el.className = "dr" + (i+1<day ? " got" : "") + (i+1===day ? " now" : ""); el.innerHTML = "<small>Day " + (i+1) + "</small><b>" + r + "</b>🪙"; g.appendChild(el); });
  $("drText").textContent = "Day " + day + ": +" + REW[day-1] + " 🪙. Come back tomorrow for more!";
  $("drDlg").showModal();
}
$("drClaim").onclick = ()=>{
  if(drPending){ save.coins += REW[drPending-1]; save.dr = { last: dateKey(), day: drPending }; drPending = null; LS.set("save", save); hud(); sfx.done(); }
  $("drDlg").close();
};

function confetti(){
  if(REDUCED) return;
  const host = $("win"), c = document.createElement("canvas"); c.id = "confetti";
  const ctx = c.getContext && c.getContext("2d"); if(!ctx) return;
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight; host.appendChild(c);
  const P = Array.from({length:90}, ()=>({ x:W/2 + (Math.random()-.5)*80, y:H*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*10-3, s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:COLORS[(Math.random()*COLORS.length)|0] }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(t - t0 < 1800) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

/* new day while the app was left open */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(save.last && save.last !== dateKey() && save.last !== dateKey(y) && save.streak){ save.streak = 0; LS.set("save", save); }
  if(mode==="daily" && puzzleDate !== dateKey() && (moves===0 || finished)){ startGame("daily"); } else render();
  checkDailyReward();
});

let deferred = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred = e; $("install").hidden = false; });
$("install").onclick = async ()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("install").hidden = true; };
window.addEventListener("appinstalled", ()=>{ $("install").hidden = true; });

/* service worker */
if("serviceWorker" in navigator && !NATIVE){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

applyTheme(save.theme);
startGame("daily");
setTimeout(checkDailyReward, 350);
Ads.init();

  levelColorCount,

  solve,
  checkDailyReward
};
