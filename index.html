<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14172b">
<meta name="description" content="Color Quest: a daily colour-sorting puzzle. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Color Quest</title>
<style>
:root{--bg:#14172b;--panel:#1f2340;--text:#f2f4ff;--muted:#9aa0c8;--accent:#ffd24a;--glass:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.chips{display:flex;gap:8px}
.chip{background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--text)}
nav{display:flex;gap:8px;margin:6px 0 10px}
nav button{flex:1}
button{font:inherit;color:var(--text);background:var(--panel);border:0;border-radius:12px;padding:10px 12px;cursor:pointer}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#1b1b1b;font-weight:700}
button:disabled{opacity:.4}
#info{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:2px 4px 8px}
#board{flex:1;display:flex;flex-wrap:wrap;gap:22px 14px;justify-content:center;align-content:center;padding:10px 0}
.bottle{width:48px;height:168px;border:3px solid rgba(255,255,255,.55);border-top-color:rgba(255,255,255,.25);border-radius:6px 6px 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;padding:3px;gap:2px;position:relative}
.bottle.sel{transform:translateY(-18px);animation:lift .15s ease-out}
.bottle.land{animation:land .26s ease-out;z-index:5}
@keyframes land{from{transform:translate(var(--tx),var(--ty)) rotate(var(--rot))}to{transform:none}}
.seg.fill{animation:fillIn .3s ease-out;transform-origin:bottom}
@keyframes fillIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stream{position:fixed;width:6px;border-radius:3px;transform-origin:top;animation:streamIn .22s ease-out forwards;z-index:4;pointer-events:none}
@keyframes streamIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bottle.land,.seg.fill,.stream,.bottle.sel{animation:none}}
@keyframes lift{from{transform:translateY(0)}to{transform:translateY(-18px)}}
.bottle.done{border-color:#7dffb0;box-shadow:0 0 12px #7dffb066}
.seg{flex:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:rgba(0,0,0,.65)}
.seg:first-child{border-bottom-left-radius:18px;border-bottom-right-radius:18px}
.noshape .seg span{display:none}
footer{display:flex;gap:8px;padding:10px 0 14px}
footer button{flex:1}
dialog{background:var(--panel);color:var(--text);border:0;border-radius:18px;padding:22px;max-width:340px;width:88%;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px}
.stars{font-size:36px;letter-spacing:4px;margin:8px 0}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;font-size:12px}
#cal div{aspect-ratio:1;border-radius:6px;background:var(--glass);display:flex;align-items:center;justify-content:center;color:var(--muted)}
#cal div.won{background:#4cd98a;color:#0b2a1a;font-weight:700}
#cal div.today{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎨 Color Quest</h1>
    <div class="chips"><span class="chip">🔥 <b id="streak">0</b></span><span class="chip">⭐ <b id="stars">0</b></span></div>
  </header>
  <nav>
    <button id="mDaily" class="on">Daily</button>
    <button id="mEndless">Endless</button>
    <button id="mCal">Calendar</button>
    <button id="mSet">⚙︎</button>
  </nav>
  <div id="info"><span id="title"></span><span id="moves"></span></div>
  <div id="board"></div>
  <footer>
    <button id="undo">↶ Undo</button>
    <button id="hint">💡 Hint</button>
    <button id="restart">⟲ Restart</button>
    <button id="install" hidden>⬇ Install</button>
  </footer>
</div>

<dialog id="win">
  <h2 id="winTitle">Solved!</h2>
  <div class="stars" id="winStars"></div>
  <div id="winText" style="color:var(--muted)"></div>
  <div class="row"><button id="share">Share</button><button id="next" class="on">Continue</button></div>
</dialog>

<dialog id="calDlg">
  <h2 id="calTitle"></h2>
  <div id="cal"></div>
  <div class="row"><button id="calClose" class="on">Close</button></div>
</dialog>

<dialog id="setDlg">
  <h2>Settings</h2>
  <div class="row"><button id="sndBtn">Sound: On</button></div>
  <div class="row"><button id="cbBtn">Colour-blind symbols</button></div>
  <div class="row"><button id="resetBtn">Reset progress</button></div>
  <div class="row"><button id="setClose" class="on">Close</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";
const CAP = 4;
const COLORS = ["#ff5a5f","#ffa63d","#ffe14d","#7ddc4a","#27c3a6","#3fa7ff","#6c63ff","#c05cff","#ff6fb5","#9a6b45","#9aa3b2","#1fd1ff"];
const SYMBOLS = ["●","▲","■","◆","★","✚","♥","☾","✖","▼","◐","☀"];
const DAILY_COLORS = [7,5,6,7,6,8,9]; // Sun..Sat
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- storage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("cq."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cq."+k, JSON.stringify(v)); }catch(e){} }
};
let save = LS.get("save", { streak:0, best:0, last:null, won:{}, stars:0, level:1, cb:false });

/* ---------- sound (synthesised with WebAudio, no files) ---------- */
const sfx = (()=>{
  let ctx = null, master = null;
  const on = ()=> save.snd !== false;
  function init(){
    if(ctx) return true;
    try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .28; master.connect(ctx.destination); }catch(e){ return false; }
    return true;
  }
  function ready(){ if(!on() || !init()) return false; if(ctx.state === "suspended") ctx.resume(); return true; }
  function tone(f, t0, dur, type, vol, f2){
    const now = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now + t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, now + t0 + dur);
    g.gain.setValueAtTime(.0001, now + t0); g.gain.exponentialRampToValueAtTime(vol, now + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, now + t0 + dur);
    o.connect(g); g.connect(master); o.start(now + t0); o.stop(now + t0 + dur + .02);
  }
  function pour(){
    if(!ready()) return;
    const dur = .55, len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.5;
    bp.frequency.setValueAtTime(500, ctx.currentTime); bp.frequency.linearRampToValueAtTime(1400, ctx.currentTime + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, ctx.currentTime); g.gain.linearRampToValueAtTime(.55, ctx.currentTime + .12); g.gain.linearRampToValueAtTime(.0001, ctx.currentTime + dur);
    src.connect(bp); bp.connect(g); g.connect(master); src.start();
  }
  return {
    select(){ if(ready()) tone(620, 0, .07, "sine", .35); },
    bad(){ if(ready()) tone(170, 0, .12, "square", .18, 110); },
    undo(){ if(ready()) tone(420, 0, .09, "triangle", .3, 260); },
    pour,
    done(){ if(!ready()) return; tone(880, 0, .18, "sine", .3); tone(1320, .09, .25, "sine", .28); },
    win(){ if(!ready()) return; [523.25, 659.25, 783.99, 1046.5].forEach((f,k)=>tone(f, k*.11, .3, "triangle", .35)); }
  };
})();
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------- seeded RNG ---------- */
function hash(str){ let h = 1779033703 ^ str.length; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return h>>>0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

/* ---------- puzzle core ---------- */
const topOf = b => b.length ? b[b.length-1] : -1;
function topRun(b){ if(!b.length) return 0; const c = topOf(b); let n = 0; for(let i=b.length-1;i>=0&&b[i]===c;i--) n++; return n; }
function canPour(a, b){ if(!a.length || b.length>=CAP) return false; if(b.length && topOf(b)!==topOf(a)) return false; if(!b.length && a.every(x=>x===a[0])) return false; return true; }
function pour(state, i, j){ const a = state[i], b = state[j]; const n = Math.min(topRun(a), CAP-b.length); for(let k=0;k<n;k++) b.push(a.pop()); return n; }
const isSolved = s => s.every(b => b.length===0 || (b.length===CAP && b.every(x=>x===b[0])));
const key = s => s.map(b=>b.join("")).sort().join("|");

function solve(start, cap=60000, rnd=null){
  const seen = new Set([key(start)]); let nodes = 0;
  function dfs(s, path){
    if(isSolved(s)) return path;
    if(++nodes > cap) return null;
    const moves = [];
    for(let i=0;i<s.length;i++) for(let j=0;j<s.length;j++){
      if(i===j || !canPour(s[i], s[j])) continue;
      const score = (s[j].length? 10:0) + topRun(s[i]) + (s[i].length===topRun(s[i])? 3:0) + (rnd? rnd()*6 : 0);
      moves.push([score,i,j]);
    }
    moves.sort((x,y)=>y[0]-x[0]);
    for(const [,i,j] of moves){
      const t = s.map(b=>b.slice()); pour(t,i,j);
      const k = key(t); if(seen.has(k)) continue; seen.add(k);
      const r = dfs(t, path.concat([[i,j]])); if(r) return r;
    }
    return null;
  }
  return dfs(start.map(b=>b.slice()), []);
}

function generate(seedStr, nColors){
  for(let attempt=0; attempt<50; attempt++){
    const rnd = mulberry32(hash(seedStr + ":" + attempt));
    const pool = []; for(let c=0;c<nColors;c++) for(let k=0;k<CAP;k++) pool.push(c);
    for(let i=pool.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
    const bottles = []; for(let i=0;i<nColors;i++) bottles.push(pool.slice(i*CAP,(i+1)*CAP));
    bottles.push([],[]);
    if(isSolved(bottles)) continue;
    let sol = solve(bottles);
    if(sol){
      // try several differently-ordered searches and keep the shortest solution as par
      for(let k=0;k<24;k++){ const alt = solve(bottles, 15000, mulberry32(hash(seedStr+":alt"+k))); if(alt && alt.length < sol.length) sol = alt; }
      return { bottles, par: sol.length };
    }
  }
  // fallback (should not happen): plain deal with a loose par
  const pool = []; for(let c=0;c<nColors;c++) for(let k=0;k<CAP;k++) pool.push(c);
  const bottles = []; for(let i=0;i<nColors;i++) bottles.push(pool.slice(i*CAP,(i+1)*CAP));
  bottles.push([],[]); bottles[0].reverse();
  return { bottles, par: nColors*4 };
}

/* ---------- game state ---------- */
let busy = false, fx = null;
let mode = "daily", puzzleDate = "", seedStr = "", puzzle = null, state = [], history = [], sel = -1, moves = 0, finished = false;

const $ = id => document.getElementById(id);
function dateKey(d=new Date()){ const p = n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("show"),1600); }

function startGame(m){
  mode = m; finished = false; sel = -1; moves = 0; history = []; plan = null;
  let n;
  if(m==="daily"){
    const d = new Date(); puzzleDate = dateKey(d); seedStr = "daily-" + puzzleDate; n = DAILY_COLORS[d.getDay()];
    $("title").textContent = WEEKDAYS[d.getDay()] + " · " + dateKey(d);
  } else {
    const lv = save.level; seedStr = "level-" + lv; n = Math.min(4 + Math.floor((lv-1)/3), 11);
    $("title").textContent = "Level " + lv;
  }
  puzzle = generate(seedStr, n);
  state = puzzle.bottles.map(b=>b.slice());
  $("mDaily").classList.toggle("on", m==="daily"); $("mEndless").classList.toggle("on", m==="endless");
  render();
}

function render(){
  const board = $("board"); board.innerHTML = "";
  board.classList.toggle("noshape", !save.cb);
  state.forEach((b,i)=>{
    const el = document.createElement("div");
    el.className = "bottle" + (i===sel?" sel":"") + (b.length===CAP && b.every(x=>x===b[0])?" done":"");
    b.forEach((c,si)=>{ const s = document.createElement("div"); s.className = "seg" + (fx && fx.to===i && si >= b.length - fx.n ? " fill" : ""); s.style.background = COLORS[c]; s.innerHTML = "<span>"+SYMBOLS[c]+"</span>"; el.appendChild(s); });
    if(fx && fx.from===i){ el.classList.add("land"); el.style.setProperty("--tx", fx.tx+"px"); el.style.setProperty("--ty", fx.ty+"px"); el.style.setProperty("--rot", fx.rot+"deg"); }
    el.setAttribute("role","button"); el.setAttribute("aria-label","Bottle "+(i+1)+(b.length? ", "+b.length+" layers":", empty")); el.addEventListener("click", ()=>tap(i));
    board.appendChild(el);
  });
  fx = null;
  $("moves").textContent = "Moves " + moves + " · Par " + (puzzle? puzzle.par : "-");
  $("undo").disabled = !history.length;
  $("streak").textContent = save.streak; $("stars").textContent = save.stars;
}

function tap(i){
  if(finished || busy) return;
  if(sel === -1){ if(state[i].length) { sel = i; sfx.select(); render(); } return; }
  if(sel === i){ sel = -1; sfx.select(); render(); return; }
  if(canPour(state[sel], state[i])){ doPour(sel, i); }
  else if(state[i].length){ sel = i; sfx.select(); render(); }
  else { sel = -1; sfx.bad(); render(); }
}

function doPour(a, b){
  busy = true;
  history.push(state.map(x=>x.slice()));
  const color = topOf(state[a]);
  const els = $("board").children, sEl = els[a], tEl = els[b];
  let tx = 0, ty = 0, rot = 0;
  const finish = ()=>{
    const n = pour(state, a, b); moves++; sel = -1;
    fx = REDUCED ? null : { from:a, to:b, n, tx, ty, rot };
    busy = false; render();
    if(navigator.vibrate) navigator.vibrate(15);
    const full = state[b].length === CAP && state[b].every(x=>x===state[b][0]);
    if(isSolved(state)) win(); else if(full) sfx.done();
  };
  if(REDUCED || !sEl || !tEl){ sfx.pour(); finish(); return; }
  sEl.classList.remove("sel");
  const sr = sEl.getBoundingClientRect(), tr = tEl.getBoundingClientRect();
  const dir = (tr.left + tr.width/2) >= (sr.left + sr.width/2) ? 1 : -1;
  rot = dir * 65;
  const mouthX = Math.sin(rot*Math.PI/180) * sr.height/2 * dir * dir;   // horizontal shift of the mouth when tilted
  tx = (tr.left + tr.width/2) - (sr.left + sr.width/2) - Math.abs(mouthX) * dir;
  ty = (tr.top - 14) - (sr.top + sr.height/2) + Math.cos(rot*Math.PI/180) * sr.height/2;
  sEl.style.zIndex = 5; sEl.style.transition = "transform .3s ease";
  sEl.style.transform = "translate("+tx+"px,"+ty+"px) rotate("+rot+"deg)";
  sfx.pour();
  const stream = document.createElement("div");
  setTimeout(()=>{
    stream.className = "stream"; stream.style.background = COLORS[color];
    stream.style.left = (tr.left + tr.width/2 - 3) + "px"; stream.style.top = (tr.top - 10) + "px"; stream.style.height = (tr.height * .75) + "px";
    document.body.appendChild(stream);
  }, 280);
  setTimeout(()=>{ stream.remove(); finish(); }, 600);
}

function starsFor(m, par){ return m <= Math.ceil(par*1.1) ? 3 : m <= par*1.5 ? 2 : 1; }

function win(){
  finished = true;
  const st = starsFor(moves, puzzle.par);
  let extra = "";
  if(mode==="daily"){
    const k = puzzleDate;
    if(!save.won[k]){
      save.stars += st;
      const prev = new Date(k+"T12:00:00"); prev.setDate(prev.getDate()-1);
      save.streak = (save.last === dateKey(prev)) ? save.streak+1 : 1;
      save.last = k; save.best = Math.max(save.best, save.streak);
      save.won[k] = { moves, stars: st };
      extra = "Streak: " + save.streak + " 🔥 (best " + save.best + ")";
    } else {
      extra = "Practice run: today's result is already saved.";
    }
    $("next").textContent = "Done";
  } else {
    save.stars += st; save.level++; extra = "Next: Level " + save.level; $("next").textContent = "Next level";
  }
  LS.set("save", save); render();
  $("winTitle").textContent = "Solved!";
  $("winStars").textContent = "⭐".repeat(st) + "☆".repeat(3-st);
  $("winText").innerHTML = moves + " moves (par " + puzzle.par + ")<br>" + extra;
  sfx.win();
  $("win").showModal();
}

/* ---------- controls ---------- */
$("undo").onclick = ()=>{ if(busy||!history.length||finished) return; sfx.undo(); state = history.pop(); moves = Math.max(0,moves-1); sel=-1; render(); };
$("restart").onclick = ()=>{ if(busy) return; plan = null; state = puzzle.bottles.map(b=>b.slice()); history=[]; moves=0; sel=-1; finished=false; render(); };
/* hints follow one cached plan so repeated hints always make progress (no oscillating suggestions) */
let plan = null;
const exactKey = st => st.map(b=>b.join("")).join("|");
function nextHint(){
  let idx = plan ? plan.keys.indexOf(exactKey(state)) : -1;
  if(idx < 0 || idx >= plan.mv.length){
    const mv = solve(state, 20000); if(!mv || !mv.length) return null;
    const keys = [], t = state.map(b=>b.slice()); keys.push(exactKey(t));
    for(const [i,j] of mv){ pour(t,i,j); keys.push(exactKey(t)); }
    plan = { mv, keys }; idx = 0;
  }
  return plan.mv[idx];
}
$("hint").onclick = ()=>{
  if(finished || busy) return;
  const m = nextHint();
  if(!m){ toast("No hint available"); return; }
  const [i,j] = m; sel = i; render();
  const t = $("board").children[j]; if(t){ t.style.outline = "3px dashed #ffd24a"; t.style.outlineOffset = "3px"; setTimeout(()=>{ t.style.outline = ""; }, 1200); }
};
$("mDaily").onclick = ()=>{ if(!busy) startGame("daily"); };
$("mEndless").onclick = ()=>{ if(!busy) startGame("endless"); };
$("next").onclick = ()=>$("win").close();
$("win").addEventListener("close", ()=>{ if(finished && mode==="endless") startGame("endless"); });
$("share").onclick = async ()=>{
  const st = starsFor(moves, puzzle.par);
  const text = "Color Quest " + (mode==="daily"? dateKey() : "Level "+(save.level-1)) + "\n" + "⭐".repeat(st) + "☆".repeat(3-st) + " · " + moves + " moves (par " + puzzle.par + ")" + (mode==="daily" ? "\n🔥 " + save.streak : "");
  try{ if(navigator.share) await navigator.share({text}); else { await navigator.clipboard.writeText(text); toast("Copied!"); } }catch(e){}
};

/* calendar */
$("mCal").onclick = ()=>{
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  $("calTitle").textContent = d.toLocaleString(undefined,{month:"long",year:"numeric"});
  const cal = $("cal"); cal.innerHTML = "";
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++) cal.appendChild(document.createElement("div"));
  for(let day=1; day<=days; day++){
    const k = dateKey(new Date(y,m,day)), el = document.createElement("div");
    el.textContent = save.won[k] ? "★" : day;
    if(save.won[k]) el.classList.add("won");
    if(day===d.getDate()) el.classList.add("today");
    cal.appendChild(el);
  }
  $("calDlg").showModal();
};
$("calClose").onclick = ()=>$("calDlg").close();

/* settings */
$("mSet").onclick = ()=>$("setDlg").showModal();
$("setClose").onclick = ()=>$("setDlg").close();
const syncSnd = ()=>{ $("sndBtn").textContent = "Sound: " + (save.snd === false ? "Off" : "On"); };
$("sndBtn").onclick = ()=>{ save.snd = save.snd === false; LS.set("save", save); syncSnd(); if(save.snd !== false) sfx.select(); };
syncSnd();
$("cbBtn").onclick = ()=>{ save.cb = !save.cb; LS.set("save", save); render(); toast(save.cb?"Symbols on":"Symbols off"); };
$("resetBtn").onclick = ()=>{ if(confirm("Reset all progress?")){ save = { streak:0, best:0, last:null, won:{}, stars:0, level:1, cb:save.cb }; LS.set("save", save); $("setDlg").close(); startGame(mode); } };

/* streak decay if a day was missed */
(function(){ const y = new Date(); y.setDate(y.getDate()-1); if(save.last && save.last !== dateKey() && save.last !== dateKey(y)){ save.streak = 0; LS.set("save", save); } })();

/* new day while the app was left open */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(save.last && save.last !== dateKey() && save.last !== dateKey(y) && save.streak){ save.streak = 0; LS.set("save", save); }
  if(mode==="daily" && puzzleDate !== dateKey() && (moves===0 || finished)){ startGame("daily"); } else render();
});

/* install prompt */
let deferred = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred = e; $("install").hidden = false; });
$("install").onclick = async ()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("install").hidden = true; };
window.addEventListener("appinstalled", ()=>{ $("install").hidden = true; });

/* service worker */
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

startGame("daily");
window.__cq = { nextHint, get state(){ return state; } };
})();
</script>
</body>
</html>
